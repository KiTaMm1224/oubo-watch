name: インターン監視

on:
  schedule:
    - cron: "17 20 * * 4"   # 毎週金曜 5:17（日本時間）。Claude の金曜チェックより前に作る
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "intern_watch.py"
      - ".github/workflows/intern-watch.yml"

permissions:
  contents: write

concurrency:
  group: intern-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ライブラリを入れる
        run: pip install --disable-pip-version-check -q requests==2.32.3 beautifulsoup4==4.12.3
      - name: インターンの募集を見る
        run: python intern_watch.py
      - name: 結果を保存する
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intern_state.json data/intern_digest.md || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "intern-watch $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 10; done
          exit 1
